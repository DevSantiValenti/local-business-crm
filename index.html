<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM de Negocios Locales</title>
  <script>
    const savedTheme = localStorage.getItem("crm-theme") || "dark";
    if (savedTheme === "dark") document.documentElement.classList.add("dark");
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: "#6366F1",
            success: "#22C55E",
            danger: "#EF4444",
            slatebg: "#F8FAFC"
          },
          boxShadow: {
            soft: "0 10px 30px rgba(15, 23, 42, 0.08)"
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-slatebg text-slate-800 dark:bg-slate-950 dark:text-slate-100">
  <div class="min-h-screen lg:flex">
    <aside class="sidebar-shell border-r border-slate-200 bg-white/85 backdrop-blur dark:border-slate-800 dark:bg-slate-950/80 xl:w-72 lg:w-64 w-full lg:min-h-screen">
      <div class="flex h-full flex-col">
        <div class="border-b border-slate-200 px-6 py-6 dark:border-slate-800">
          <div class="flex items-center gap-3">
            <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-brand to-cyan-400 text-white shadow-soft">
              <span class="text-lg font-extrabold">CRM</span>
            </div>
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.25em] text-slate-400">Ventas locales</p>
              <h1 class="text-lg font-bold text-slate-900 dark:text-white">Panel comercial</h1>
            </div>
          </div>
        </div>

        <nav class="flex-1 overflow-y-auto px-4 py-5">
          <p class="px-3 text-xs font-semibold uppercase tracking-[0.22em] text-slate-400">Espacio de trabajo</p>
          <div id="nav-sections" class="mt-3 space-y-1"></div>

          <div class="mt-8">
            <div class="mb-3 flex items-center justify-between px-3">
              <p class="text-xs font-semibold uppercase tracking-[0.22em] text-slate-400">Categorias</p>
              <button id="add-category-btn" class="rounded-xl border border-slate-200 px-2 py-1 text-xs font-semibold text-slate-500 transition hover:border-brand hover:text-brand dark:border-slate-700 dark:text-slate-300">Nueva</button>
            </div>
            <div id="sidebar-categories" class="space-y-1"></div>
          </div>
        </nav>

        <div class="border-t border-slate-200 px-4 py-4 dark:border-slate-800">
          <div class="rounded-3xl bg-slate-900 px-4 py-4 text-white shadow-soft dark:bg-slate-900/90">
            <div class="flex items-center justify-between gap-4">
              <div>
                <p class="text-sm font-semibold">Atajos rapidos</p>
                <p class="mt-2 text-xs text-slate-300">Usa <kbd>/</kbd> para buscar, <kbd>N</kbd> para crear y <kbd>K</kbd> para cambiar de vista.</p>
              </div>
              <button id="theme-toggle" class="rounded-2xl border border-white/10 px-3 py-2 text-xs font-semibold text-white/90 transition hover:bg-white/10">Modo</button>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <main class="min-w-0 flex-1">
      <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/75 backdrop-blur dark:border-slate-800 dark:bg-slate-950/70">
        <div class="flex flex-col gap-4 px-4 py-4 sm:px-6 lg:flex-row lg:items-center lg:justify-between">
          <div>
            <p id="page-eyebrow" class="text-xs font-semibold uppercase tracking-[0.26em] text-slate-400">Resumen</p>
            <h2 id="page-title" class="text-2xl font-bold text-slate-900 dark:text-white">Centro de ventas</h2>
          </div>
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
            <div class="relative">
              <input id="global-search" type="search" placeholder="Buscar leads, clientes o categorias..." class="w-full rounded-2xl border border-slate-200 bg-slate-50 py-3 pl-11 pr-4 text-sm outline-none transition focus:border-brand focus:bg-white dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 sm:w-80">
              <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">⌕</span>
            </div>
            <button id="add-lead-btn" class="rounded-2xl bg-brand px-4 py-3 text-sm font-semibold text-white shadow-soft transition hover:translate-y-[-1px] hover:bg-indigo-500">Nuevo lead</button>
          </div>
        </div>
      </header>

      <section class="px-4 py-6 sm:px-6">
        <div id="dashboard-section" class="section-panel space-y-6"></div>
        <div id="categories-section" class="section-panel hidden space-y-6"></div>
        <div id="leads-section" class="section-panel hidden space-y-6"></div>
        <div id="clients-section" class="section-panel hidden space-y-6"></div>
        <div id="import-section" class="section-panel hidden space-y-6"></div>
        <div id="statistics-section" class="section-panel hidden space-y-6"></div>
        <div id="settings-section" class="section-panel hidden space-y-6"></div>
      </section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="pointer-events-none fixed inset-x-0 top-4 z-50 flex flex-col items-center gap-2 px-4"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
